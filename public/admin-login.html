<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Load Board sign-in</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<style>:root{--bg:#fff;--tx:#111;--line:#d5d9de}@media (prefers-color-scheme:dark){:root{--bg:#15191c;--tx:#f2f4f5;--line:#2a3035}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,Segoe UI,Roboto,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{width:100%;max-width:360px;padding:24px}h1{margin:0 0 4px;font-size:22px}p{color:#6b7280;margin:0 0 16px}
label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font-size:16px;background:var(--bg);color:var(--tx)}
button{margin-top:18px;width:100%;height:46px;border:0;border-radius:6px;background:#0b4f5c;color:#fff;font-size:16px;font-weight:600;cursor:pointer}#e{color:#b91c1c;margin-top:12px;min-height:20px}</style></head>
<body><div class="box"><h1>Load Board</h1><p>Staff sign-in</p><label>Email</label><input id="e1" type="email" autocomplete="username"><label>Password</label><input id="p1" type="password" autocomplete="current-password"><button onclick="go()">Sign in</button><div id="e"></div></div>
<script>
document.getElementById('p1').addEventListener('keydown',function(ev){if(ev.key==='Enter')go()});
function go(){fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'flexdrive'},body:JSON.stringify({email:document.getElementById('e1').value,password:document.getElementById('p1').value})})
.then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})}).then(function(x){
 if(!x.ok){document.getElementById('e').textContent=x.j.error||'Sign-in failed.';return}
 if(x.j.role!=='admin'&&x.j.role!=='manager'){fetch('/api/logout',{method:'POST',headers:{'X-Requested-With':'flexdrive'}}).then(function(){document.getElementById('e').textContent='This account does not have staff access.'});return}
 location.href='/admin'}).catch(function(){document.getElementById('e').textContent='No connection. Try again.'})}
</script></body></html>
